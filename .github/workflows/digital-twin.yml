name: LinkedIn digital twin
on:
  schedule:
    - cron: '2-57/5 * * * *'
    - cron: '15 11 * * *'  # prepare the continuous 17:00-22:00 IST session
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        type: choice
        options: [demo, preview, live, session]
        default: demo
permissions:
  contents: write
  models: read
concurrency:
  group: linkedin-digital-twin
  cancel-in-progress: false
jobs:
  twin:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_ENDPOINT: ${{ vars.MODEL_ENDPOINT }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      TWIN_MODEL_DIR: ${{ github.workspace }}/testing/local-model
      NO_PROXY: 127.0.0.1,localhost
      APIFY_MONTHLY_BUDGET_USD: ${{ vars.APIFY_MONTHLY_BUDGET_USD || '4' }}
      TWIN_LOW_COST_MODE: ${{ vars.TWIN_LOW_COST_MODE || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runtime
        run: python -m pip install -r automation/requirements.txt
      - name: Configure state checkpoints
        run: |
          git config user.name 'Sergey Bulaev'
          git config user.email 's@bulaev.org'
      - name: Configure AI route
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview') ||
          ((github.event_name == 'schedule' || (inputs.mode == 'live' || inputs.mode == 'session')) && (vars.TWIN_LIVE == '' || vars.TWIN_LIVE == 'true'))
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -z "$MODEL_ENDPOINT" ]; then
            if [ -n "$MODEL_API_KEY" ]; then
              echo 'MODEL_ENDPOINT=https://api.openai.com/v1/chat/completions' >> "$GITHUB_ENV"
              if [ -z "$MODEL_NAME" ]; then
                echo 'MODEL_NAME=gpt-4.1-mini' >> "$GITHUB_ENV"
              fi
              echo 'Paid AI route selected.'
            elif [ -n "$APIFY_TOKEN" ]; then
              python - <<'PY' >> "$GITHUB_ENV"
          from automation.apify_ai import model_info
          info = model_info()
          if info is None:
              raise RuntimeError('Apify AI metadata is unavailable or invalid')
          print('MODEL_ENDPOINT=' + info[0])
          print('MODEL_NAME=' + info[1])
          PY
              echo 'Apify balance funds the private AI route.'
            else
              echo 'paidAI_not_connected_fallback'
            fi
          else
            echo 'Configured AI route selected.'
          fi
      - name: Cache verified free CPU model
        if: >-
          (env.MODEL_ENDPOINT == '' || env.TWIN_LOW_COST_MODE == 'true') &&
          ((github.event_name == 'workflow_dispatch' && inputs.mode == 'preview') ||
          ((github.event_name == 'schedule' || (inputs.mode == 'live' || inputs.mode == 'session')) && (vars.TWIN_LIVE == '' || vars.TWIN_LIVE == 'true')))
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            testing/local-model/llama-b11512-bin-ubuntu-x64.tar.gz
            testing/local-model/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          key: twin-cpu-qwen3-4b-instruct-2507-q4km-a06e946b-llama-b11512-${{ runner.os }}-${{ runner.arch }}
      - name: Start verified free CPU model
        if: >-
          (env.MODEL_ENDPOINT == '' || env.TWIN_LOW_COST_MODE == 'true') &&
          ((github.event_name == 'workflow_dispatch' && inputs.mode == 'preview') ||
          ((github.event_name == 'schedule' || (inputs.mode == 'live' || inputs.mode == 'session')) && (vars.TWIN_LIVE == '' || vars.TWIN_LIVE == 'true')))
        run: |
          bash automation/start_local_model.sh
          echo 'INTERACTION_MODEL_ENDPOINT=http://127.0.0.1:8080/v1/chat/completions' >> "$GITHUB_ENV"
          if [ -z "$MODEL_ENDPOINT" ]; then
            echo 'MODEL_ENDPOINT=http://127.0.0.1:8080/v1/chat/completions' >> "$GITHUB_ENV"
            echo 'MODEL_NAME=twin-local' >> "$GITHUB_ENV"
          fi
      - name: Offline preview
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'demo'
        run: python -m automation.twin --demo --state /tmp/twin-preview.json
      - name: Verify real model generation without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preview'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m automation.twin --preview --state /tmp/twin-model-preview.json
      - name: Run autonomous workflow
        if: github.event_name == 'schedule' || (inputs.mode == 'live' || inputs.mode == 'session')
        env:
          PUBLORA_API_KEY: ${{ secrets.PUBLORA_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          TWIN_LIVE: ${{ vars.TWIN_LIVE || 'true' }}
          TWIN_READ_ENABLED: ${{ vars.TWIN_READ_ENABLED || 'true' }}
          TWIN_CHECKPOINT_GIT: 'true'
          TWIN_RUN_MODE: ${{ inputs.mode }}
          TWIN_SCHEDULE: ${{ github.event.schedule }}
          UNIPILE_API_KEY: ${{ secrets.UNIPILE_API_KEY }}
          UNIPILE_BASE_URL: ${{ vars.UNIPILE_BASE_URL }}
          UNIPILE_ACCOUNT_ID: ${{ vars.UNIPILE_ACCOUNT_ID }}
        run: |
          if [ "$TWIN_LIVE" != 'true' ]; then
            echo 'Live execution is paused by TWIN_LIVE. Set it to true or remove it to resume.'
            exit 0
          fi
          python - <<'PYCODE'
          from datetime import datetime
          import os
          import subprocess
          import sys
          from zoneinfo import ZoneInfo
          hour = datetime.now(ZoneInfo('Asia/Calcutta')).hour
          wait = os.getenv('TWIN_RUN_MODE') == 'session' or os.getenv('TWIN_SCHEDULE') == '15 11 * * *'
          command = [sys.executable, '-m', 'automation.session' if wait or 17 <= hour < 22 else 'automation.twin']
          if wait:
              command.append('--wait-for-window')
          subprocess.run(command, check=True)
          PYCODE
      - name: Activity summary
        if: always()
        run: |
          if [ -f automation/state.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          s = json.loads(Path('automation/state.json').read_text(encoding='utf-8'))
          print('## Digital twin activity')
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo('Asia/Calcutta')).date().isoformat()
          print('Today: ' + today + ' (IST)')
          print('Allocated attempts: ' + str(s['days'].get(today, {})))
          confirmed = {'reaction': 0, 'comment': 0, 'reply': 0}
          for action in s['actions'].values():
              stamp = datetime.fromisoformat(action['at'].replace('Z', '+00:00'))
              if stamp.astimezone(ZoneInfo('Asia/Calcutta')).date().isoformat() == today:
                  if action.get('status') == 'sent' and action.get('kind') in confirmed:
                      confirmed[action['kind']] += 1
          print('Confirmed actions: ' + str(confirmed))
          session = s.get('operational_status', {}).get('session')
          if session:
              print('Continuous session: ' + str(session))
          print('Inspect automation/state.json for content and action status. Ambiguous writes are never retried automatically.')
          PY
          fi
